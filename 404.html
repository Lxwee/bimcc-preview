<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | 筑云科技 BIMCC</title>
  <script>
    // 智能拦截旧版目录访问并秒级重定向到根路径
    (function() {
      var path = window.location.pathname;
      if (path.indexOf('/bimcc-redesign/') !== -1) {
        var newPath = path.replace('/bimcc-redesign/', '/');
        window.location.replace(newPath + window.location.search + window.location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20261105_03">
  <style>
    body {
      background-color: #050811;
      color: #f1f5f9;

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .not-found-card {
      max-width: 520px;
      padding: 48px 36px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .status-code {
      font-size: 5rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }
    .title {
      font-size: 1.5rem;

      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-home {

      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(14, 165, 233, 0.6);
    }
  </style>
</head>
